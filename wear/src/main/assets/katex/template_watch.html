<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <link rel="stylesheet" href="katex.min.css">
  <script src="katex.min.js"></script>
  <script src="auto-render.min.js"></script>
  <script src="marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000000;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.5;
      margin: 0;
      /* Padding tailored for circular smartwatch displays: top/bottom curves */
      padding: 48px 16px 80px 16px;
      word-wrap: break-word;
      user-select: none;
    }
    h1, h2, h3, h4 {
      color: #00e5ff;
      margin-top: 0.8em;
      margin-bottom: 0.4em;
      font-weight: 600;
    }
    h1 { font-size: 1.25em; border-bottom: 1px solid #222222; padding-bottom: 4px; }
    h2 { font-size: 1.15em; }
    h3 { font-size: 1.05em; color: #ffb74d; }
    p { margin: 0.5em 0; }
    ul, ol { padding-left: 20px; margin: 0.5em 0; }
    li { margin-bottom: 4px; }
    strong { color: #ffffff; font-weight: 700; }
    em { color: #80d8ff; }
    pre, code {
      background-color: #1a1a1a;
      border-radius: 4px;
      font-family: "JetBrains Mono", Consolas, monospace;
      color: #a7ffeb;
    }
    code {
      padding: 1px 4px;
      font-size: 0.88em;
    }
    pre {
      padding: 8px;
      overflow-x: auto;
      border: 1px solid #333333;
    }
    blockquote {
      border-left: 3px solid #00e5ff;
      margin: 0.5em 0;
      padding-left: 8px;
      color: #aaaaaa;
    }
    .katex {
      font-size: 1.1em;
      color: #ffffff;
    }
    .katex-display {
      margin: 0.6em 0 !important;
    }
    .katex-display-wrapper {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
      margin: 0.5em 0;
      text-align: center;
      background: #0d0d0d;
      border-radius: 8px;
      border: 1px solid #1f1f1f;
    }
    .placeholder-hint {
      color: #777777;
      text-align: center;
      margin-top: 60px;
      font-size: 0.9em;
      line-height: 1.6;
    }
    .status-pill {
      display: inline-block;
      font-size: 10px;
      color: #69f0ae;
      border: 1px solid #1b5e20;
      background: #0a200e;
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div id="content">
    <div class="placeholder-hint">
      <div style="font-size: 26px; margin-bottom: 8px;">⌚</div>
      Ожидание решения с телефона...<br>
      <span style="font-size: 0.8em; color: #555555;">Скопируйте текст в Gemini и вставьте в приложении на смартфоне</span>
    </div>
  </div>

  <script>
    let currentFontSize = 17;

    function renderMarkdownWithMath(rawText) {
      if (!rawText || !rawText.trim()) {
        document.getElementById('content').innerHTML = `
          <div class="placeholder-hint">
            <div style="font-size: 26px; margin-bottom: 8px;">⌚</div>
            Ожидание решения с телефона...<br>
            <span style="font-size: 0.8em; color: #555555;">Скопируйте текст в Gemini и вставьте в приложении на смартфоне</span>
          </div>`;
        return;
      }

      const mathBlocks = [];

      // 1. Protect block math $$...$$ and \[...\]
      let text = rawText.replace(/\$\$([\s\S]*?)\$\$/g, (match, formula) => {
        const id = `KATEXBLOCKPLACEHOLDER${mathBlocks.length}END`;
        mathBlocks.push({ id, formula, display: true });
        return `\n\n${id}\n\n`;
      }).replace(/\\\[([\s\S]*?)\\\]/g, (match, formula) => {
        const id = `KATEXBLOCKPLACEHOLDER${mathBlocks.length}END`;
        mathBlocks.push({ id, formula, display: true });
        return `\n\n${id}\n\n`;
      });

      // 2. Protect inline math $...$ and \(...\)
      text = text.replace(/\$([^\$\n]+?)\$/g, (match, formula) => {
        const id = `KATEXINLINEPLACEHOLDER${mathBlocks.length}END`;
        mathBlocks.push({ id, formula, display: false });
        return id;
      }).replace(/\\\(([\s\S]*?)\\\)/g, (match, formula) => {
        const id = `KATEXINLINEPLACEHOLDER${mathBlocks.length}END`;
        mathBlocks.push({ id, formula, display: false });
        return id;
      });

      // 3. Parse Markdown
      let html = marked.parse(text);

      // 4. Restore math with delimiters
      for (const item of mathBlocks) {
        if (item.display) {
          html = html.replace(new RegExp(`<p>${item.id}</p>`, 'g'), () => `<div class="katex-display-wrapper">$$${item.formula}$$</div>`)
                     .replace(new RegExp(item.id, 'g'), () => `$$${item.formula}$$`);
        } else {
          html = html.replace(new RegExp(item.id, 'g'), () => `$${item.formula}$`);
        }
      }

      const container = document.getElementById('content');
      container.innerHTML = html;

      // 5. Run KaTeX auto-render
      renderMathInElement(container, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    }

    window.setContent = function(text) {
      renderMarkdownWithMath(text);
      window.scrollTo(0, 0);
    };

    window.scrollByDelta = function(pixels) {
      window.scrollBy({ top: pixels, behavior: 'smooth' });
    };

    window.changeFontSize = function(delta) {
      currentFontSize = Math.max(12, Math.min(30, currentFontSize + delta));
      document.body.style.fontSize = currentFontSize + 'px';
      return currentFontSize;
    };

    window.setFontSize = function(sizePx) {
      currentFontSize = Math.max(12, Math.min(30, sizePx));
      document.body.style.fontSize = currentFontSize + 'px';
    };
  </script>
</body>
</html>
